name: Bug report
description: Something is broken or behaves incorrectly
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for reporting. Vistanology Open runs 100% locally — no data leaves your device.
  - type: input
    id: tool
    attributes:
      label: Tool / area
      placeholder: e.g. QR Studio, Library, Settings
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: 1. Go to… 2. Click… 3. See…
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Browser & OS
      placeholder: e.g. Chrome 130 / Windows 11
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version (footer)
      placeholder: e.g. 0.1.0
    validations:
      required: true